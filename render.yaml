# ==============================================================================
# Render Blueprint (render.yaml) for IBake Spring Boot REST Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: ibake-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # Low latency for Indian market (options: singapore, oregon, frankfurt, ohio)
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false # Set to your Supabase JDBC connection URL (e.g., jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require)
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # Set to your database user (e.g., postgres.xxxx)
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # Set to your Supabase database password
      - key: JWT_SECRET
        generateValue: true # Generates a secure random 256-bit key automatically on Render
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*,http://localhost:3000,http://localhost:5173"
      - key: HIBERNATE_DDL_AUTO
        value: update
